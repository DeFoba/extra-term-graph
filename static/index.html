<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Extra-Term-Graph — Поиск и анализ терминологического графа научных публикаций.">
  <title>Extra-Term-Graph — Терминологический граф</title>
  <link rel="icon" type="image/x-icon" href="/static/media/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/media/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/media/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/media/apple-touch-icon.png">
  <link rel="manifest" href="/static/media/site.webmanifest">
  <link rel="stylesheet" href="/static/style.css">
  <!-- Neovis.js — Neo4j graph visualization (local copy, Apache 2.0 license) -->
  <script src="/static/neovis.js"></script>
</head>
<body>
  <div id="app">
    <!-- ========== Header ========== -->
    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <div class="logo-icon">🔬</div>
          <span>Extra-Term-Graph</span>
          <div class="db-status-badge" id="db-status-badge" title="Проверка подключения Neo4j...">
            <span class="status-dot"></span>
            <span class="status-text">Neo4j</span>
          </div>
        </div>
        <nav class="tabs" id="main-tabs">
          <button class="tab-btn active" data-tab="publications" id="tab-publications">
            <span class="tab-icon">📄</span> Публикации
          </button>
          <button class="tab-btn" data-tab="keywords" id="tab-keywords">
            <span class="tab-icon">🏷️</span> Ключевые слова
          </button>
          <button class="tab-btn" data-tab="graph" id="tab-graph">
            <span class="tab-icon">📊</span> Граф
          </button>
          <button class="tab-btn" data-tab="cypher" id="tab-cypher">
            <span class="tab-icon">⚡</span> Cypher-запросы
          </button>
        </nav>
      </div>
    </header>

    <!-- ========== Main Content ========== -->
    <main class="main">

      <!-- Stats Bar -->
      <div class="stats-bar" id="stats-bar">
        <div class="stat-card">
          <div class="stat-label">Публикаций</div>
          <div class="stat-value" id="stat-pubs">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Ключевых слов</div>
          <div class="stat-value" id="stat-keywords">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Связей Pub↔KW</div>
          <div class="stat-value" id="stat-relations">—</div>
        </div>
      </div>

      <!-- ===== Publications Tab ===== -->
      <section class="tab-panel active" id="panel-publications">
        <div class="search-bar">
          <div class="search-input-wrap">
            <span class="search-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
            <input type="text" class="search-input" id="pub-search"
                   placeholder="Поиск через Neo4j: по названию, аннотации или через связанные термины..."
                   autocomplete="off">
          </div>
          <button class="search-graph-btn" id="pub-search-graph-btn" title="Визуализировать поиск на графе">📊 На графе</button>
        </div>

        <div id="pub-detail"></div>
        <div class="results-info" id="pub-results-info"></div>
        <div class="pub-list" id="pub-list"></div>
        <div class="pagination" id="pub-pagination"></div>
      </section>

      <!-- ===== Keywords Tab ===== -->
      <section class="tab-panel" id="panel-keywords">
        <div class="search-bar">
          <div class="search-input-wrap">
            <span class="search-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
            <input type="text" class="search-input" id="kw-search"
                   placeholder="Поиск ключевых слов через Neo4j..."
                   autocomplete="off">
          </div>
          <button class="search-graph-btn" id="kw-search-graph-btn" title="Визуализировать поиск на графе">📊 На графе</button>
          <div class="filter-group" id="kw-filters">
            <button class="filter-btn active" data-method="all">Все</button>
            <button class="filter-btn" data-method="author">👤 Авторские</button>
            <button class="filter-btn" data-method="tfidf">📊 TF-IDF</button>
            <button class="filter-btn" data-method="keybert">🤖 KeyBERT</button>
          </div>
        </div>

        <div id="kw-detail"></div>
        <div class="results-info" id="kw-results-info"></div>
        <div class="kw-grid" id="kw-grid"></div>
        <div class="pagination" id="kw-pagination"></div>
      </section>

      <!-- ===== Graph Visualization Tab ===== -->
      <section class="tab-panel" id="panel-graph">
        <div class="graph-controls">
          <div class="graph-controls-row">
            <div class="graph-query-select-wrap">
              <label for="graph-query-select" class="graph-label">Запрос:</label>
              <select id="graph-query-select" class="graph-select">
                <option value="all_pub_kw">📄 Все публикации и термины (LIMIT 100)</option>
                <option value="similar_pubs">🔗 Связанные публикации (общие термины)</option>
                <option value="top_keywords">🏷️ Топ-10 ключевых слов и их публикации</option>
                <option value="custom">✏️ Пользовательский Cypher</option>
              </select>
            </div>
            <div class="graph-actions">
              <button class="graph-btn" id="graph-run-btn" title="Выполнить запрос">▶ Запуск</button>
              <button class="graph-btn graph-btn-secondary" id="graph-stabilize-btn" title="Стабилизировать граф">⏸ Стоп</button>
              <button class="graph-btn graph-btn-secondary" id="graph-clear-btn" title="Очистить граф">🗑 Очистить</button>
            </div>
          </div>
          <div class="graph-custom-query" id="graph-custom-query" style="display:none;">
            <textarea id="graph-cypher-input" class="graph-textarea" rows="3"
                      placeholder="MATCH (n)-[r]->(m) RETURN n, r, m LIMIT 50"></textarea>
          </div>
        </div>

        <!-- Graph Legend -->
        <div class="graph-legend">
          <span class="legend-item"><span class="legend-dot legend-dot-document"></span> Document</span>
          <span class="legend-item"><span class="legend-dot legend-dot-kw-author"></span> Keyword (автор)</span>
          <span class="legend-item"><span class="legend-dot legend-dot-kw-tfidf"></span> Keyword (TF-IDF)</span>
          <span class="legend-item"><span class="legend-dot legend-dot-kw-keybert"></span> Keyword (KeyBERT)</span>
          <span class="legend-item"><span class="legend-line legend-line-has-keyword"></span> HAS_KEYWORD</span>
        </div>

        <!-- Graph Container -->
        <div class="graph-container" id="graph-viz"></div>

        <!-- Graph Status -->
        <div class="graph-status" id="graph-status"></div>
      </section>

      <!-- ===== Cypher Tab ===== -->
      <section class="tab-panel" id="panel-cypher">
        <div class="cypher-intro">
          <p>Готовые Cypher-запросы для <strong>Neo4j</strong>. Выберите объект или скопируйте запрос целиком и вставьте в Neo4j Browser.</p>
        </div>

        <div class="search-bar">
          <div class="search-input-wrap">
            <span class="search-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
            <input type="text" class="search-input" id="cypher-search"
                   placeholder="Поиск публикации или ключевого слова для генерации запроса..."
                   autocomplete="off">
          </div>
        </div>

        <div id="cypher-results"></div>

        <div class="cypher-section">
          <h3 class="cypher-section-title">📋 Общие запросы</h3>
          <div id="cypher-general"></div>
        </div>
      </section>

    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
